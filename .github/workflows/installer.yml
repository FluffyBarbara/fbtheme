name: Установщик

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Иконка и описание exe
        working-directory: installer
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --in winres/winres.json --arch amd64

      - name: Сборка
        working-directory: installer
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o ../dist/TokyoMidnightBlack-Setup.exe .

      - name: Публикация в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view installer >/dev/null 2>&1 || gh release create installer \
            --title "Установщик TokyoMidnightBlack" \
            --notes "Скачай TokyoMidnightBlack-Setup.exe и запусти. Установщик сам поставит свежий BetterDiscord, тему TokyoMidnightBlack и плагин автообновления." \
            --latest
          gh release upload installer dist/TokyoMidnightBlack-Setup.exe --clobber
